<div class="cw-chk-title">Checkout</div>

<div class="cw-chk-step cw-chk-step-active">
    <span class="cw-chk-circle cw-chk-circle-active">1</span> Billing address
</div>
<div class="cw-chk-body">
    <div class="cw-chk-ship">☑ Ship to the same address</div>
    <div class="cw-chk-panel">
        <div class="cw-chk-panel-hint">Select a billing address from your address book or enter a new address.</div>
        <div class="cw-chk-panel-row">
            <span class="cw-chk-addrsel">John Smith, United States of America, New York, 21 West 52nd Street ▾</span>
            <button type="button" class="cw-chk-btn" data-cw-style="button" onclick="return false;">EDIT</button>
            <button type="button" class="cw-chk-btn" data-cw-style="button" onclick="return false;">DELETE</button>
        </div>
    </div>
    <div class="cw-chk-continue-wrap">
        <button type="button" class="cw-chk-continue" data-cw-style="button" onclick="return false;">CONTINUE</button>
    </div>
</div>

<div class="cw-chk-step"><span class="cw-chk-circle">2</span> Shipping address</div>
<div class="cw-chk-step cw-chk-step-alt"><span class="cw-chk-circle">3</span> Shipping method</div>
<div class="cw-chk-step"><span class="cw-chk-circle">4</span> Payment method</div>
<div class="cw-chk-step cw-chk-step-alt"><span class="cw-chk-circle">5</span> Payment information</div>
